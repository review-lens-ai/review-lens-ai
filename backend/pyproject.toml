[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming (see docs/standards), UP modern syntax, B bugbear
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The fake environment must be set BEFORE the app is imported, so these imports
# cannot sit at the top of the file.
"tests/conftest.py" = ["E402"]
