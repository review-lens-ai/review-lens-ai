[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
